<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Italiano - Pratica la conversazione</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        :root {
            --primary-color: #10a37f;
            --secondary-color: #f7f7f8;
            --text-color: #2d333a;
            --light-text: #6e7681;
            --border-color: #e5e5e5;
            --chat-bg: #ffffff;
            --user-msg-bg: #f7f7f8;
            --bot-msg-bg: #ffffff;
            --hover-color: #0e916f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            line-height: 1.5;
            color: var(--text-color);
            background-color: var(--secondary-color);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1rem;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1rem;
            margin-bottom: 1rem;
            background: var(--chat-bg);
            border-radius: 0.5rem;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .message {
            display: flex;
            margin-bottom: 1.5rem;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--primary-color);
            color: white;
            font-weight: bold;
        }

        .user-avatar {
            background: var(--light-text);
        }

        .message-content {
            flex-grow: 1;
            padding: 1rem;
            border-radius: 0.5rem;
            max-width: calc(100% - 60px);
        }

        .user-message .message-content {
            background: var(--user-msg-bg);
        }

        .bot-message .message-content {
            background: var(--bot-msg-bg);
            border: 1px solid var(--border-color);
        }

        .input-container {
            position: relative;
            margin-top: auto;
        }

        .message-input {
            width: 100%;
            padding: 1rem 3rem 1rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            font-size: 1rem;
            resize: none;
            height: 60px;
            background: white;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }

        .message-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(16, 163, 127, 0.2);
        }

        .send-button {
            position: absolute;
            right: 1rem;
            bottom: 1rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 0.3rem;
            padding: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .send-button:hover {
            background: var(--hover-color);
        }

        .send-button:disabled {
            background: var(--light-text);
            cursor: not-allowed;
        }

        .language-toggle {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            justify-content: center;
        }

        .language-button {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 0.3rem;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .language-button.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .typing-indicator {
            display: flex;
            gap: 0.3rem;
            padding: 0.5rem;
            margin-top: 0.5rem;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--light-text);
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="language-toggle">
            <button class="language-button active" onclick="setLanguage('it')">Italiano</button>
            <button class="language-button" onclick="setLanguage('es')">Español</button>
        </div>
        
        <div class="chat-container" id="chatContainer">
            <div class="message bot-message">
                <div class="avatar">AI</div>
                <div class="message-content">
                    Ciao! Sono il tuo assistente per praticare l'italiano. Come posso aiutarti oggi?
                </div>
            </div>
        </div>

        <div class="input-container">
            <textarea 
                class="message-input" 
                id="messageInput" 
                placeholder="Scrivi un messaggio..."
                rows="1"
                onkeydown="if(event.keyCode == 13 && !event.shiftKey) { event.preventDefault(); sendMessage(); }">
            </textarea>
            <button class="send-button" onclick="sendMessage()">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script>
        let currentLanguage = 'it';
        const synth = window.speechSynthesis;

        function setLanguage(lang) {
            currentLanguage = lang;
            document.querySelectorAll('.language-button').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.toLowerCase().includes(lang));
            });
            
            const placeholder = lang === 'it' ? 'Scrivi un messaggio...' : 'Escribe un mensaje...';
            document.getElementById('messageInput').placeholder = placeholder;
        }

        function addMessage(text, isUser = false) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
            
            const avatar = document.createElement('div');
            avatar.className = `avatar ${isUser ? 'user-avatar' : ''}`;
            avatar.innerText = isUser ? 'TU' : 'AI';
            
            const content = document.createElement('div');
            content.className = 'message-content';
            content.innerText = text;
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(content);
            chatContainer.appendChild(messageDiv);
            
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function addTypingIndicator() {
            const indicator = document.createElement('div');
            indicator.className = 'message bot-message typing-indicator';
            indicator.innerHTML = `
                <div class="avatar">AI</div>
                <div class="message-content">
                    <div class="dots">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                </div>
            `;
            document.getElementById('chatContainer').appendChild(indicator);
            return indicator;
        }

        function removeTypingIndicator(indicator) {
            indicator.remove();
        }

        function speak(text) {
            if (synth.speaking) {
                synth.cancel();
                return;
            }

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = currentLanguage === 'it' ? 'it-IT' : 'es-ES';
            utterance.rate = 0.9;
            utterance.pitch = 1;
            
            synth.speak(utterance);
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            addMessage(message, true);
            input.value = '';
            
            const indicator = addTypingIndicator();
            
            // Simular respuesta del bot después de un breve delay
            setTimeout(() => {
                removeTypingIndicator(indicator);
                const response = getResponse(message);
                addMessage(response);
                speak(response);
            }, 1500);
        }

        function getResponse(message) {
            // Aquí puedes implementar la lógica para generar respuestas
            // Por ahora, usaremos respuestas simples
            const responses = {
                it: [
                    "Capisco quello che vuoi dire. Continua pure!",
                    "Interessante! Vuoi elaborare questo concetto?",
                    "Ottimo! Stai facendo progressi con l'italiano.",
                    "Hai una buona pronuncia! Continuiamo a praticare.",
                    "Questa è una bella frase! Vuoi provare a dire qualcos'altro?"
                ],
                es: [
                    "Entiendo lo que quieres decir. ¡Continúa!",
                    "¡Interesante! ¿Quieres elaborar este concepto?",
                    "¡Excelente! Estás progresando con el italiano.",
                    "¡Tienes buena pronunciación! Sigamos practicando.",
                    "¡Esta es una buena frase! ¿Quieres intentar decir algo más?"
                ]
            };

            const randomIndex = Math.floor(Math.random() * responses[currentLanguage].length);
            return responses[currentLanguage][randomIndex];
        }
    </script>
</body>
</html>
