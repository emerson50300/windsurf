<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Italiano - Pratica la conversazione</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        :root {
            --primary-color: #10a37f;
            --secondary-color: #f7f7f8;
            --text-color: #2d333a;
            --light-text: #6e7681;
            --border-color: #e5e5e5;
            --chat-bg: #ffffff;
            --user-msg-bg: #f7f7f8;
            --bot-msg-bg: #ffffff;
            --hover-color: #0e916f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            line-height: 1.5;
            color: var(--text-color);
            background-color: var(--secondary-color);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1rem;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1rem;
            margin-bottom: 1rem;
            background: var(--chat-bg);
            border-radius: 0.5rem;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .message {
            display: flex;
            margin-bottom: 1.5rem;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--primary-color);
            color: white;
            font-weight: bold;
        }

        .user-avatar {
            background: var(--light-text);
        }

        .message-content {
            flex-grow: 1;
            padding: 1rem;
            border-radius: 0.5rem;
            max-width: calc(100% - 60px);
        }

        .user-message .message-content {
            background: var(--user-msg-bg);
        }

        .bot-message .message-content {
            background: var(--bot-msg-bg);
            border: 1px solid var(--border-color);
        }

        .input-container {
            position: relative;
            margin-top: auto;
        }

        .message-input {
            width: 100%;
            padding: 1rem 3rem 1rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            font-size: 1rem;
            resize: none;
            height: 60px;
            background: white;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }

        .message-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(16, 163, 127, 0.2);
        }

        .send-button {
            position: absolute;
            right: 1rem;
            bottom: 1rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 0.3rem;
            padding: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .send-button:hover {
            background: var(--hover-color);
        }

        .send-button:disabled {
            background: var(--light-text);
            cursor: not-allowed;
        }

        .language-toggle {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            justify-content: center;
        }

        .language-button {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 0.3rem;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .language-button.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .typing-indicator {
            display: flex;
            gap: 0.3rem;
            padding: 0.5rem;
            margin-top: 0.5rem;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--light-text);
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="language-toggle">
            <button class="language-button active" onclick="setLanguage('it')">Italiano</button>
            <button class="language-button" onclick="setLanguage('es')">Español</button>
        </div>
        
        <div class="chat-container" id="chatContainer">
            <div class="message bot-message">
                <div class="avatar">AI</div>
                <div class="message-content">
                    Ciao! Sono il tuo assistente per praticare l'italiano. Come posso aiutarti oggi?
                </div>
            </div>
        </div>

        <div class="input-container">
            <textarea 
                class="message-input" 
                id="messageInput" 
                placeholder="Scrivi un messaggio..."
                rows="1"
                onkeydown="if(event.keyCode == 13 && !event.shiftKey) { event.preventDefault(); sendMessage(); }">
            </textarea>
            <button class="send-button" onclick="sendMessage()">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script>
        let currentLanguage = 'it';
        let userLevel = 'none'; // Nivel del usuario: none, principiante, intermedio, avanzado
        let currentTopic = ''; // Tema actual que se está practicando
        const synth = window.speechSynthesis;

        function setLanguage(lang) {
            currentLanguage = lang;
            document.querySelectorAll('.language-button').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.toLowerCase().includes(lang));
            });
            
            const placeholder = lang === 'it' ? 'Scrivi un messaggio...' : 'Escribe un mensaje...';
            document.getElementById('messageInput').placeholder = placeholder;
        }

        function addMessage(text, isUser = false) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
            
            const avatar = document.createElement('div');
            avatar.className = `avatar ${isUser ? 'user-avatar' : ''}`;
            avatar.innerText = isUser ? 'TU' : 'AI';
            
            const content = document.createElement('div');
            content.className = 'message-content';
            content.innerText = text;
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(content);
            chatContainer.appendChild(messageDiv);
            
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function addTypingIndicator() {
            const indicator = document.createElement('div');
            indicator.className = 'message bot-message typing-indicator';
            indicator.innerHTML = `
                <div class="avatar">AI</div>
                <div class="message-content">
                    <div class="dots">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                </div>
            `;
            document.getElementById('chatContainer').appendChild(indicator);
            return indicator;
        }

        function removeTypingIndicator(indicator) {
            indicator.remove();
        }

        function speak(text) {
            if (synth.speaking) {
                synth.cancel();
                return;
            }

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = currentLanguage === 'it' ? 'it-IT' : 'es-ES';
            utterance.rate = 0.9;
            utterance.pitch = 1;
            
            synth.speak(utterance);
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            addMessage(message, true);
            input.value = '';
            
            const indicator = addTypingIndicator();
            
            // Simular respuesta del bot después de un breve delay
            setTimeout(() => {
                removeTypingIndicator(indicator);
                const response = getResponse(message);
                addMessage(response);
                speak(response);
            }, 1500);
        }

        function getResponse(message) {
            const lowerMessage = message.toLowerCase();

            // Si el usuario aún no tiene nivel, preguntar
            if (userLevel === 'none') {
                if (lowerMessage.includes('principiante') || lowerMessage.includes('básico')) {
                    userLevel = 'principiante';
                    return currentLanguage === 'it' ?
                        "Perfetto! Iniziamo con le basi. Vuoi imparare:\n1. Saluti e presentazioni\n2. Numeri\n3. Frasi di base\n\nScegli un numero o dimmi cosa vuoi imparare!" :
                        "¡Perfecto! Empecemos con lo básico. ¿Qué quieres aprender?\n1. Saludos y presentaciones\n2. Números\n3. Frases básicas\n\n¡Elige un número o dime qué quieres aprender!";
                } else if (lowerMessage.includes('intermedio')) {
                    userLevel = 'intermedio';
                    return currentLanguage === 'it' ?
                        "Ottimo! Possiamo lavorare su:\n1. Conversazione\n2. Grammatica\n3. Vocabolario specifico\n\nCosa preferisci?" :
                        "¡Excelente! Podemos trabajar en:\n1. Conversación\n2. Gramática\n3. Vocabulario específico\n\n¿Qué prefieres?";
                } else if (lowerMessage.includes('avanzado')) {
                    userLevel = 'avanzado';
                    return currentLanguage === 'it' ?
                        "Fantastico! Possiamo concentrarci su:\n1. Espressioni idiomatiche\n2. Letteratura\n3. Cultura italiana\n\nDa dove vuoi iniziare?" :
                        "¡Fantástico! Podemos concentrarnos en:\n1. Expresiones idiomáticas\n2. Literatura\n3. Cultura italiana\n\n¿Por dónde quieres empezar?";
                } else {
                    return currentLanguage === 'it' ?
                        "Per iniziare, dimmi il tuo livello di italiano:\n- Principiante\n- Intermedio\n- Avanzato" :
                        "Para empezar, dime tu nivel de italiano:\n- Principiante\n- Intermedio\n- Avanzado";
                }
            }

            // Detectar tipo de solicitud
            if (lowerMessage.includes('traduc')) {
                return handleTranslation(message);
            } else if (lowerMessage.includes('vocabulario') || lowerMessage.includes('palabras')) {
                return handleVocabulary(message);
            } else if (lowerMessage.includes('gramática') || lowerMessage.includes('grammatica')) {
                return handleGrammar(message);
            } else if (lowerMessage.includes('ejercicio') || lowerMessage.includes('practica')) {
                return handleExercise(message);
            } else if (lowerMessage.includes('frases') || lowerMessage.includes('ejemplos')) {
                return generatePhrases(getRequestedNumber(message));
            } else if (lowerMessage.includes('historia') || lowerMessage.includes('diálogo')) {
                return generateStory();
            }

            // Respuesta por defecto
            return getDefaultResponse();
        }

        function getRequestedNumber(message) {
            const numMatch = message.match(/\d+/);
            return numMatch ? parseInt(numMatch[0]) : 5;
        }

        function handleTranslation(message) {
            // Implementar lógica de traducción básica
            const commonTranslations = {
                'hola': 'ciao',
                'gracias': 'grazie',
                'por favor': 'per favore',
                'buenos días': 'buongiorno',
                'buenas noches': 'buonanotte',
                'cómo estás': 'come stai',
                'me llamo': 'mi chiamo'
                // Agregar más traducciones
            };

            let response = currentLanguage === 'it' ?
                "Ecco alcune traduzioni comuni:\n\n" :
                "Aquí tienes algunas traducciones comunes:\n\n";

            for (const [es, it] of Object.entries(commonTranslations)) {
                response += `${es} → ${it}\n`;
            }

            return response;
        }

        function handleVocabulary(message) {
            const vocabulary = {
                comida: [
                    {it: 'pane', es: 'pan'},
                    {it: 'pasta', es: 'pasta'},
                    {it: 'carne', es: 'carne'},
                    {it: 'pesce', es: 'pescado'},
                    {it: 'frutta', es: 'fruta'}
                ],
                viajes: [
                    {it: 'biglietto', es: 'billete'},
                    {it: 'treno', es: 'tren'},
                    {it: 'aereo', es: 'avión'},
                    {it: 'albergo', es: 'hotel'},
                    {it: 'passaporto', es: 'pasaporte'}
                ],
                clima: [
                    {it: 'sole', es: 'sol'},
                    {it: 'pioggia', es: 'lluvia'},
                    {it: 'caldo', es: 'calor'},
                    {it: 'freddo', es: 'frío'},
                    {it: 'vento', es: 'viento'}
                ]
            };

            let topic = 'comida'; // tema por defecto
            if (message.includes('viaj')) topic = 'viajes';
            if (message.includes('clima')) topic = 'clima';

            let response = currentLanguage === 'it' ?
                `Vocabolario sul tema "${topic}":\n\n` :
                `Vocabulario sobre "${topic}":\n\n`;

            vocabulary[topic].forEach(word => {
                response += `${word.it} → ${word.es}\n`;
            });

            return response;
        }

        function handleGrammar(message) {
            const grammarLessons = {
                principiante: [
                    "Artículos definidos:\nil (masc. singular)\nla (fem. singular)\ni (masc. plural)\nle (fem. plural)\n\nEjemplos:\nil libro → el libro\nla casa → la casa",
                    "Presente simple del verbo 'essere' (ser/estar):\nIo sono\nTu sei\nLui/Lei è\nNoi siamo\nVoi siete\nLoro sono"
                ],
                intermedio: [
                    "Pasado próximo (passato prossimo):\nho mangiato → he comido\nsei andato → has ido\nè venuta → ha venido",
                    "Pronombres directos:\nmi → me\nti → te\nlo/la → lo/la\nci → nos\nvi → os\nli/le → los/las"
                ],
                avanzado: [
                    "Subjuntivo presente:\nche io sia\nche tu sia\nche lui/lei sia\nche noi siamo\nche voi siate\nche loro siano",
                    "Condicional:\nIo vorrei → yo querría\nTu potresti → tú podrías\nLui/Lei dovrebbe → él/ella debería"
                ]
            };

            const lessons = grammarLessons[userLevel];
            const randomLesson = lessons[Math.floor(Math.random() * lessons.length)];

            return currentLanguage === 'it' ?
                "Lezione di grammatica:\n\n" + randomLesson :
                "Lección de gramática:\n\n" + randomLesson;
        }

        function handleExercise(message) {
            const exercises = {
                principiante: [
                    "Completa la frase:\nIo _____ Marco. (sono/sei/è)",
                    "Traduce al italiano:\n'Hola, ¿cómo estás?'",
                    "¿Qué artículo usar?\n___ pizza è buona. (il/la/i/le)"
                ],
                intermedio: [
                    "Conjuga en pasado próximo:\nIo (mangiare) la pasta.",
                    "Elige el pronombre correcto:\n___ vedo al parco. (lo/la/li/le)",
                    "Traduce usando el condicional:\n'Me gustaría un café'"
                ],
                avanzado: [
                    "Usa el subjuntivo:\nPenso che lui _____ (essere) felice.",
                    "Transforma en pasiva:\n'Il gatto mangia il pesce'",
                    "Usa el gerundio:\n'Mientras como, leo el periódico'"
                ]
            };

            const levelExercises = exercises[userLevel];
            const randomExercise = levelExercises[Math.floor(Math.random() * levelExercises.length)];

            return currentLanguage === 'it' ?
                "Esercizio:\n\n" + randomExercise + "\n\nScrivi la tua risposta!" :
                "Ejercicio:\n\n" + randomExercise + "\n\n¡Escribe tu respuesta!";
        }

        function generateStory() {
            const stories = [
                {
                    title: "Al Caffè",
                    it: "Marco entra in un caffè. 'Buongiorno!' dice al barista. 'Un cappuccino, per favore.' Il barista sorride. 'Certo! Vuole anche un cornetto?' 'Sì, grazie!' risponde Marco.",
                    es: "Marco entra en un café. '¡Buenos días!' dice al barista. 'Un cappuccino, por favor.' El barista sonríe. '¡Claro! ¿Quiere también un croissant?' 'Sí, ¡gracias!' responde Marco."
                },
                {
                    title: "In Stazione",
                    it: "Anna è in stazione. 'Scusi, a che ora parte il treno per Roma?' chiede a un impiegato. 'Il prossimo treno parte tra dieci minuti, dal binario tre.' 'Grazie mille!' dice Anna.",
                    es: "Ana está en la estación. 'Disculpe, ¿a qué hora sale el tren a Roma?' pregunta a un empleado. 'El próximo tren sale en diez minutos, desde el andén tres.' '¡Muchas gracias!' dice Ana."
                }
            ];

            const randomStory = stories[Math.floor(Math.random() * stories.length)];
            
            return `${randomStory.title}\n\nItaliano:\n${randomStory.it}\n\nEspañol:\n${randomStory.es}`;
        }

        function generatePhrases(num) {
            const phrases = [
                {
                    it: "Ciao, come stai?",
                    es: "Hola, ¿cómo estás?"
                },
                {
                    it: "Mi chiamo Marco e tu?",
                    es: "Me llamo Marco, ¿y tú?"
                },
                {
                    it: "Dove si trova la stazione?",
                    es: "¿Dónde está la estación?"
                },
                {
                    it: "Vorrei un caffè, per favore.",
                    es: "Quisiera un café, por favor."
                },
                {
                    it: "Quanto costa questo?",
                    es: "¿Cuánto cuesta esto?"
                },
                {
                    it: "Oggi è una bellissima giornata!",
                    es: "¡Hoy es un día hermoso!"
                },
                {
                    it: "Puoi aiutarmi, per favore?",
                    es: "¿Puedes ayudarme, por favor?"
                },
                {
                    it: "Parlo un po' di italiano.",
                    es: "Hablo un poco de italiano."
                },
                {
                    it: "A che ora parte il treno?",
                    es: "¿A qué hora sale el tren?"
                },
                {
                    it: "Grazie mille per tutto!",
                    es: "¡Muchas gracias por todo!"
                },
                {
                    it: "Scusi, non ho capito.",
                    es: "Disculpe, no he entendido."
                },
                {
                    it: "Che bello vederti!",
                    es: "¡Qué bueno verte!"
                },
                {
                    it: "Mi piace molto l'Italia.",
                    es: "Me gusta mucho Italia."
                },
                {
                    it: "Posso avere il menu?",
                    es: "¿Puedo tener el menú?"
                },
                {
                    it: "Che tempo fa oggi?",
                    es: "¿Qué tiempo hace hoy?"
                },
                {
                    it: "Buon appetito!",
                    es: "¡Buen provecho!"
                },
                {
                    it: "Come si dice ... in italiano?",
                    es: "¿Cómo se dice ... en italiano?"
                },
                {
                    it: "Non parlo molto bene l'italiano.",
                    es: "No hablo muy bien el italiano."
                },
                {
                    it: "Dov'è il bagno?",
                    es: "¿Dónde está el baño?"
                },
                {
                    it: "Mi sono perso/a.",
                    es: "Me he perdido."
                }
            ];

            // Mezclar el array de frases aleatoriamente
            const shuffled = [...phrases].sort(() => 0.5 - Math.random());
            
            // Tomar el número de frases solicitado
            const selected = shuffled.slice(0, Math.min(num, phrases.length));
            
            // Formatear la respuesta
            let response = currentLanguage === 'it' ? 
                "Ecco " + num + " frasi in italiano con la traduzione:\n\n" :
                "Aquí tienes " + num + " frases en italiano con su traducción:\n\n";
            
            selected.forEach((phrase, index) => {
                response += `${index + 1}. ${phrase.it}\n`;
                response += `   (${phrase.es})\n\n`;
            });
            
            response += currentLanguage === 'it' ?
                "\nVuoi praticare queste frasi? Posso aiutarti con la pronuncia!" :
                "\n¿Quieres practicar estas frases? ¡Puedo ayudarte con la pronunciación!";
            
            return response;
        }

        function getDefaultResponse() {
            const responses = {
                it: [
                    "Come posso aiutarti oggi? Possiamo:\n1. Praticare vocabolario\n2. Studiare grammatica\n3. Fare esercizi\n4. Leggere storie\n5. Tradurre frasi",
                    "Hai qualche domanda specifica sull'italiano?",
                    "Vuoi provare un esercizio di conversazione?",
                    "Posso aiutarti con la pronuncia se vuoi!"
                ],
                es: [
                    "¿Cómo puedo ayudarte hoy? Podemos:\n1. Practicar vocabulario\n2. Estudiar gramática\n3. Hacer ejercicios\n4. Leer historias\n5. Traducir frases",
                    "¿Tienes alguna pregunta específica sobre el italiano?",
                    "¿Quieres probar un ejercicio de conversación?",
                    "¡Puedo ayudarte con la pronunciación si quieres!"
                ]
            };

            return responses[currentLanguage][Math.floor(Math.random() * responses[currentLanguage].length)];
        }
    </script>
</body>
</html>
