<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat de Italiano</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7643993399830665" crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            background-color: #e5ddd5;
        }

        .whatsapp-container {
            max-width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background-color: #075E54;
            color: white;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            height: 60px;
        }

        .profile-info {
            display: flex;
            align-items: center;
        }

        .profile-info img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background-color: #e5ddd5;
            background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyCAYAAAAeP4ixAAAABmJLR0QA/wD/AP+gvaeTAAAACXBIWXMAAAsTAAALEwEAmpwYAAAAB3RJTUUH4QQQEwkySN8CyAAAAB1pVFh0Q29tbWVudAAAAAAAQ3JlYXRlZCB3aXRoIEdJTVBkLmUHAAABSUlEQVRo3u3ZMUoDURSF4S9BtBARLBRFWCuClaVgqVgErGxdgIWQFdiLddbiAgRBsBYUi4CFIOgCLARtNIVFwCJEsDATRnHuK97M++fAhXkz72Uu580kURT9qHt8Yx99XKGBFh7wjlt0cYxOHdBsZKwzHOIWl9hDG5tYwQzm8IYnXGAH25jHrMR+ZjGH9ZTIftWRL2ET4xjDbB0iE0xhCovj0J3MqFal0MQG1rCFTvQPRB7RwzXOsYu31PIQWcdiTuVHuMtDZCvn/Cae8xDp5Zw/wUceIhc554+LHjr/KzKBaSwXLdJI2XeiKpEsqP+ExXHoTo6+U6lWB3nMI2nw1MUHhjiN76lKtRp4xwnaeS+/0/ieCeITm/YQLTwXvWulweNgBPSLFnnJ8kfVkZeqI8NR6BGjLnL/h+qvOvKc9UPdRVFFUWQS+QK5KXr4AI+5tQAAAABJRU5ErkJggg==');
        }

        .message {
            max-width: 65%;
            padding: 8px 12px;
            margin: 8px;
            border-radius: 7.5px;
            position: relative;
            word-wrap: break-word;
            font-size: 14.2px;
            line-height: 19px;
        }

        .user-message {
            background: #dcf8c6;
            margin-left: auto;
            border-radius: 7.5px 0px 7.5px 7.5px;
        }

        .assistant-message {
            background: white;
            margin-right: auto;
            border-radius: 0px 7.5px 7.5px 7.5px;
        }

        .input-container {
            background: #f0f0f0;
            padding: 10px;
            display: flex;
            align-items: center;
            border-top: 1px solid #ddd;
        }

        .chat-input {
            flex: 1;
            border: none;
            border-radius: 20px;
            padding: 9px 12px;
            margin: 0 8px;
            font-size: 15px;
            background: white;
            min-height: 20px;
            max-height: 100px;
            resize: none;
        }

        .chat-input:focus {
            outline: none;
        }

        .send-button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #128C7E;
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-button i {
            font-size: 18px;
        }

        .message-time {
            font-size: 11px;
            color: rgba(0, 0, 0, 0.45);
            float: right;
            margin-left: 8px;
            margin-top: 2px;
        }

        .level-buttons,
        .topic-buttons {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin: 5px 0;
            padding: 5px;
            background: white;
            border-radius: 5px;
        }

        .level-buttons button,
        .topic-buttons button {
            background-color: #128C7E;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.8em;
            transition: all 0.3s ease;
            opacity: 0.8;
        }

        .level-buttons button:hover,
        .topic-buttons button:hover {
            opacity: 1;
        }

        .level-buttons button.active,
        .topic-buttons button.active {
            background-color: #075E54;
            opacity: 1;
        }

        @media (max-width: 768px) {
            .message {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="whatsapp-container">
        <div class="chat-header">
            <div class="profile-info">
                <img src="https://via.placeholder.com/40" alt="Chat Bot">
                <span>Chat Italiano</span>
            </div>
        </div>

        <div class="messages-container" id="messages">
            <!-- Los mensajes se agregarán aquí dinámicamente -->
        </div>

        <div class="input-container">
            <textarea id="message-input" class="chat-input" placeholder="Escribe un mensaje aquí..." rows="1"></textarea>
            <button onclick="sendMessage()" class="send-button">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script type="text/javascript">
        // Variables globales
        let currentApiKeyIndex = 0;
        let isInitialized = false;

        // Lista de API keys de Gemini
        const API_KEYS = [
            'AIzaSyCEIicKmkzZQ7kOy0yBSVt4Dc3s80GwKYw',
            'AIzaSyC_PguDMrWEn4jWCHy_-Mzfn_Wi2vsjH4A',
            'AIzaSyAV9lVQDjx6-s_Rh9ZiVhUHYYJJPaRh_OQ',
            'AIzaSyCPjkG910sUn7eWG6aWLL3y9jOKlySOgUI'
        ];

        // Función para generar respuesta usando la API de Gemini directamente
        async function generateResponse(prompt) {
            try {
                const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=AIzaSyCEIicKmkzZQ7kOy0yBSVt4Dc3s80GwKYw', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: prompt + " Importante: En el texto en italiano NO uses puntos signos de puntuación ni números escribe los números con letras"
                            }]
                        }]
                    })
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    return data.candidates[0].content.parts[0].text;
                } else {
                    return "Lo siento hubo un error al generar la respuesta";
                }
            } catch (error) {
                console.error('Error:', error);
                return "Lo siento ocurrió un error al procesar tu mensaje";
            }
        }

        // Función para enviar mensaje
        async function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            
            if (!message) return;

            // Mostrar mensaje del usuario
            addMessage(message, 'user');
            input.value = '';
            autoResize(input);

            // Mostrar indicador de carga
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message assistant-message loading';
            loadingDiv.textContent = 'Escribiendo...';
            document.getElementById('messages').appendChild(loadingDiv);

            try {
                // Construir el prompt
                const prompt = `Actúa como un profesor de italiano amigable y paciente. 
                Nivel del estudiante: principiante.
                Responde en español, pero incluye ejemplos en italiano.
                Cuando des ejemplos en italiano, marca el texto italiano con "Italiano: " al inicio.
                No uses caracteres especiales como asteriscos o bullets.
                Mensaje del estudiante: ${message}`;

                // Intentar generar respuesta
                let response = null;
                let attempts = 0;
                
                while (!response && attempts < API_KEYS.length) {
                    try {
                        response = await generateResponse(prompt);
                    } catch (error) {
                        console.error(`Error con API key ${currentApiKeyIndex + 1}:`, error);
                        currentApiKeyIndex = (currentApiKeyIndex + 1) % API_KEYS.length;
                        attempts++;
                    }
                }

                if (response) {
                    loadingDiv.remove();
                    addMessage(response, 'assistant');
                    
                    // Desplazarse al final del chat
                    const chatMessages = document.querySelector('.messages-container');
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                } else {
                    throw new Error('No se pudo obtener respuesta después de intentar con todas las API keys');
                }
            } catch (error) {
                console.error('Error:', error);
                loadingDiv.remove();
                addMessage('Lo siento, hubo un error al procesar tu mensaje. Por favor, intenta de nuevo.', 'assistant');
            }
        }

        // Función para cambiar el nivel
        function setLevel(level) {
            document.querySelectorAll('.level-buttons button').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent.toLowerCase().includes(level)) {
                    btn.classList.add('active');
                }
            });

            const messages = {
                'principiante': '¿Qué frases básicas debo aprender como principiante?',
                'intermedio': '¿Cuáles son las expresiones más comunes para nivel intermedio?',
                'avanzado': '¿Qué frases avanzadas me recomiendas practicar?'
            };

            const input = document.getElementById('message-input');
            input.value = messages[level];
            sendMessage();
        }

        // Función para cambiar el tema
        function setTopic(topic) {
            document.querySelectorAll('.topic-buttons button').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent.toLowerCase().includes(topic)) {
                    btn.classList.add('active');
                }
            });

            const messages = {
                'gramatica': '¿Cuáles son las reglas gramaticales más importantes?',
                'vocabulario': 'Dame las 10 palabras más usadas en italiano',
                'pronunciacion': '¿Cómo se pronuncian correctamente las vocales en italiano?',
                'cultura': 'Cuéntame sobre las tradiciones italianas más importantes',
                'ejercicios': 'Dame ejercicios de práctica para mi nivel',
                'conversacion': 'Frases útiles para mantener una conversación'
            };

            const input = document.getElementById('message-input');
            input.value = messages[topic];
            sendMessage();
        }

        // Evento para enviar mensaje con Enter
        document.getElementById('message-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Función para ajustar tamaño del input
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        // Función para extraer solo el texto en italiano
        function extractItalianText(text) {
            // Buscar texto después de los tres asteriscos
            const asteriskMatch = text.match(/\*\*\*([\s\S]*?)(?=\*\*\*|$)/);
            if (asteriskMatch) {
                // Limpiar el texto de puntuación y espacios extra
                return asteriskMatch[1]
                    .trim()
                    .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, '')
                    .replace(/\s+/g, ' ');
            }
            return '';
        }

        // Función para leer texto en italiano
        function speakText(text) {
            // Extraer todo el texto en italiano y limpiar signos de puntuación
            const italianText = extractItalianText(text).replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, '');
            
            if (!italianText) {
                console.log('No se encontró texto en italiano para reproducir');
                return;
            }

            // Cancelar cualquier lectura anterior
            window.speechSynthesis.cancel();

            // Dividir el texto en frases para una mejor reproducción
            const phrases = italianText.split(/[.!?]+/).filter(phrase => phrase.trim());
            
            // Configurar las voces
            const voices = window.speechSynthesis.getVoices();
            const italianVoice = voices.find(voice => voice.lang.includes('it'));
            
            // Reproducir cada frase
            phrases.forEach((phrase, index) => {
                setTimeout(() => {
                    const utterance = new SpeechSynthesisUtterance(phrase.trim());
                    
                    if (italianVoice) {
                        utterance.voice = italianVoice;
                    }
                    
                    utterance.lang = 'it-IT';
                    utterance.rate = 0.9;
                    utterance.pitch = 1;
                    utterance.volume = 1;
                    
                    window.speechSynthesis.speak(utterance);
                    
                    console.log('Reproduciendo frase en italiano:', phrase.trim());
                }, index * 2000); // Esperar 2 segundos entre cada frase
            });
        }

        // Función para añadir mensaje al chat
        function addMessage(text, sender) {
            const messagesContainer = document.querySelector('.messages-container');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;
            
            // Formatear el texto y agregar el botón de audio solo si hay texto en italiano
            const formattedText = formatText(text);
            messageDiv.innerHTML = formattedText;
            
            // Si es un mensaje del asistente, agregar el botón de audio
            if (sender === 'assistant') {
                const italianText = extractItalianText(text);
                if (italianText) {
                    const audioButton = document.createElement('button');
                    audioButton.className = 'audio-button';
                    audioButton.innerHTML = '<i class="fas fa-volume-up"></i>';
                    audioButton.onclick = () => speakText(italianText);
                    messageDiv.appendChild(audioButton);
                }
            }
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Función para formatear el texto y resaltar el italiano
        function formatText(text) {
            // Dividir el texto en líneas
            const lines = text.split('\n');
            
            // Procesar cada línea
            const formattedLines = lines.map(line => {
                // Si la línea está en italiano (entre corchetes)
                if (line.includes('[') && line.includes(']')) {
                    const italianText = line.match(/\[(.*?)\]/)[1];
                    // Remover signos de puntuación y convertir números a texto
                    const cleanItalianText = italianText
                        .trim()
                        .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "")
                        .replace(/\d+/g, num => {
                            // Aquí podrías implementar una función para convertir números a texto en italiano
                            return num; // Por ahora solo lo mantenemos
                        });
                    return line.replace(/\[(.*?)\]/, `[${cleanItalianText}]`);
                }
                return line;
            });
            
            // Unir las líneas de nuevo
            let formattedText = formattedLines.join('\n');
            
            // Resaltar el texto en italiano
            formattedText = formattedText.replace(/\[(.*?)\]/g, '<span class="italian-text">$1</span>');
            
            return formattedText;
        }
    </script>

</body>
