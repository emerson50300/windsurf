    <style>
        :root {
            --background-white: #ffffff;
            --primary-color: #4CAF50;
            --secondary-color: #81C784;
            --background-color: #F7F9FC;
            --text-main: #1a1a1a;
            --text-secondary: #404040;
            --button-color: #4CAF50;
            --hover-color: #388E3C;
            --shadow-color: rgba(0, 0, 0, 0.1);
            --border-radius: 15px;
            --border-light: #e0e0e0;
        }

        .verbs-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .verb-card {
            background-color: var(--background-white);
            border-radius: var(--border-radius);
            padding: 2rem;
            box-shadow: 0 2px 4px var(--shadow-color);
            transition: transform 0.3s ease;
        }

        .verb-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px var(--shadow-color);
        }

        .verb-title {
            color: var(--text-main);
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 1rem;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 0.5rem;
        }

        .verb-meaning {
            color: var(--text-secondary);
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
        }

        .conjugation-section {
            margin-top: 1.5rem;
        }

        .conjugation-title {
            color: var(--primary-color);
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .conjugation-grid {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .pronoun {
            color: var(--text-secondary);
            font-weight: bold;
        }

        .conjugation {
            color: var(--text-main);
        }

        .audio-button {
            background-color: var(--button-color);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: var(--border-radius);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 1rem;
            font-size: 1.1rem;
        }

        .audio-button:hover {
            background-color: var(--hover-color);
            transform: scale(1.05);
        }

        .audio-button i {
            font-size: 1.2rem;
        }
    </style>

        function playAudio(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'it-IT';
            utterance.rate = 1.0; // Velocidad normal
            utterance.pitch = 1.0; // Tono normal
            utterance.volume = 1.0; // Volumen máximo
            window.speechSynthesis.speak(utterance);
        }

        function showVerb(verb) {
            const verbData = verbs[verb];
            const modalContent = document.getElementById('modalContent');
            
            let content = `
                <div class="verb-card">
                    <div class="verb-title">Coniugazione di: ${verb}</div>
                    <div class="verb-meaning">${verbData.meaning} - ${verbData.type}</div>
                    
                    <div class="conjugation-section">
                        <div class="conjugation-title">Indicativo</div>
                        
                        <div class="conjugation-group">
                            <h3>Presente</h3>
                            <div class="conjugation-grid">
                                ${Object.entries(verbData.conjugations.presente).map(([pronoun, conj]) => `
                                    <div class="pronoun">${pronoun}</div>
                                    <div class="conjugation">${conj}</div>
                                `).join('')}
                            </div>
                        </div>

                        <div class="conjugation-group">
                            <h3>Passato prossimo</h3>
                            <div class="conjugation-grid">
                                ${Object.entries(verbData.conjugations['passato prossimo']).map(([pronoun, conj]) => `
                                    <div class="pronoun">${pronoun}</div>
                                    <div class="conjugation">${conj}</div>
                                `).join('')}
                            </div>
                        </div>

                        <div class="conjugation-group">
                            <h3>Imperfetto</h3>
                            <div class="conjugation-grid">
                                ${Object.entries(verbData.conjugations.imperfetto).map(([pronoun, conj]) => `
                                    <div class="pronoun">${pronoun}</div>
                                    <div class="conjugation">${conj}</div>
                                `).join('')}
                            </div>
                        </div>

                        <div class="conjugation-group">
                            <h3>Trapassato prossimo</h3>
                            <div class="conjugation-grid">
                                ${Object.entries(verbData.conjugations['trapassato prossimo']).map(([pronoun, conj]) => `
                                    <div class="pronoun">${pronoun}</div>
                                    <div class="conjugation">${conj}</div>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <button class="audio-button" onclick="playAudio('${verb}')">
                        <i class="fas fa-volume-up"></i>
                        Ascolta
                    </button>
                </div>
            `;
            
            modalContent.innerHTML = content;
            document.getElementById('verbModal').style.display = 'block';
        }

        // Crear botones de verbos
        const container = document.getElementById('verbsContainer');
        Object.keys(verbs).forEach(verb => {
            const card = document.createElement('div');
            card.className = 'verb-card';
            card.innerHTML = `
                <div class="verb-title">${verb}</div>
                <div class="verb-meaning">${verbs[verb].meaning} - ${verbs[verb].type}</div>
                <button class="audio-button" onclick="showVerb('${verb}')">
                    <i class="fas fa-book"></i>
                    Ver conjugación
                </button>
            `;
            container.appendChild(card);
        });

        // Cerrar modal
        document.querySelector('.close').onclick = function() {
            document.getElementById('verbModal').style.display = 'none';
        }

        // Cerrar modal cuando se hace clic fuera
        window.onclick = function(event) {
            const modal = document.getElementById('verbModal');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }
