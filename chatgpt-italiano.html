<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Italiano</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #202123;
            --secondary-color: #343541;
            --accent-color: #10a37f;
            --text-color: #fff;
            --border-color: #4d4d4f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--secondary-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 260px;
            background-color: var(--primary-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .new-chat {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
        }

        .new-chat:hover {
            background-color: #0e8f6d;
        }

        .history {
            flex: 1;
            overflow-y: auto;
        }

        .history-item {
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .history-item:hover {
            background-color: #2d2d2f;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 5px;
        }

        .user-message {
            background-color: var(--secondary-color);
        }

        .assistant-message {
            background-color: #444654;
        }

        .input-container {
            padding: 20px;
            background-color: var(--secondary-color);
            border-top: 1px solid var(--border-color);
        }

        .input-box {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        .message-input {
            width: 100%;
            padding: 12px;
            padding-right: 50px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            background-color: #40414f;
            color: var(--text-color);
            resize: none;
            min-height: 52px;
            max-height: 200px;
            overflow-y: auto;
        }

        .send-button {
            position: absolute;
            right: 10px;
            bottom: 10px;
            background: none;
            border: none;
            color: var(--accent-color);
            cursor: pointer;
            padding: 5px;
        }

        .send-button:hover {
            color: #0e8f6d;
        }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 2px;
            margin-right: 15px;
        }

        .message-content {
            display: flex;
            align-items: flex-start;
        }

        .message-text {
            flex: 1;
        }

        .user-avatar {
            background-color: #5436da;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .assistant-avatar {
            background-color: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .level-selector {
            margin-bottom: 20px;
            padding: 10px;
            background-color: #2d2d2f;
            border-radius: 5px;
        }

        .level-title {
            font-size: 0.9em;
            margin-bottom: 10px;
            color: #8e8ea0;
        }

        .level-options {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .level-option {
            padding: 8px;
            cursor: pointer;
            border-radius: 3px;
        }

        .level-option:hover {
            background-color: #3d3d3f;
        }

        .level-option.selected {
            background-color: var(--accent-color);
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <button class="new-chat">
                <i class="fas fa-plus"></i>
                Nueva conversación
            </button>
            <div class="level-selector">
                <div class="level-title">Nivel de Italiano</div>
                <div class="level-options">
                    <div class="level-option" onclick="selectLevel('A1-A2')">Principiante (A1-A2)</div>
                    <div class="level-option" onclick="selectLevel('B1-B2')">Intermedio (B1-B2)</div>
                    <div class="level-option" onclick="selectLevel('C1-C2')">Avanzado (C1-C2)</div>
                </div>
            </div>
            <div class="history">
                <!-- El historial de conversaciones se añadirá aquí -->
            </div>
        </div>
        <div class="main-content">
            <div class="chat-container" id="chat-container">
                <!-- Los mensajes se añadirán aquí -->
            </div>
            <div class="input-container">
                <div class="input-box">
                    <textarea 
                        class="message-input" 
                        id="message-input" 
                        placeholder="Escribe un mensaje..."
                        rows="1"
                        onInput="autoResize(this)"></textarea>
                    <button class="send-button" onclick="sendMessage()">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedLevel = 'A1-A2';
        let conversationHistory = [];

        function selectLevel(level) {
            selectedLevel = level;
            document.querySelectorAll('.level-option').forEach(option => {
                option.classList.remove('selected');
                if (option.textContent.includes(level)) {
                    option.classList.add('selected');
                }
            });
            addMessage('assistant', `Nivel seleccionado: ${level}. ¿En qué puedo ayudarte con tu italiano?`);
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function addMessage(type, content) {
            const chatContainer = document.getElementById('chat-container');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}-message`;

            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';

            const avatar = document.createElement('div');
            avatar.className = `avatar ${type}-avatar`;
            if (type === 'user') {
                avatar.innerHTML = 'TU';
            } else {
                avatar.innerHTML = '<i class="fas fa-robot"></i>';
            }

            const messageText = document.createElement('div');
            messageText.className = 'message-text';
            messageText.innerHTML = content;

            messageContent.appendChild(avatar);
            messageContent.appendChild(messageText);
            messageDiv.appendChild(messageContent);
            chatContainer.appendChild(messageDiv);

            chatContainer.scrollTop = chatContainer.scrollHeight;
            conversationHistory.push({ type, content });
        }

        function processUserMessage(message) {
            const lowerMessage = message.toLowerCase();
            let response = '';

            // Detectar tipo de solicitud
            if (lowerMessage.includes('traduce') || lowerMessage.includes('traducir')) {
                response = handleTranslation(message);
            } else if (lowerMessage.includes('explica') || lowerMessage.includes('explicar')) {
                response = handleGrammarExplanation(message);
            } else if (lowerMessage.includes('ejercicio') || lowerMessage.includes('practica')) {
                response = generateExercise();
            } else if (lowerMessage.includes('conversación') || lowerMessage.includes('diálogo')) {
                response = generateDialogue();
            } else {
                response = generateGenericResponse(message);
            }

            return response;
        }

        function handleTranslation(message) {
            // Simular traducción
            const textToTranslate = message.replace(/traduce|traducir/i, '').trim();
            // Aquí irían las traducciones reales
            return `Aquí tienes la traducción al italiano:\n"${textToTranslate}" → [Traducción en italiano]\n\n¿Quieres practicar la pronunciación?`;
        }

        function handleGrammarExplanation(message) {
            return `Aquí tienes la explicación gramatical según tu nivel ${selectedLevel}:\n\n[Explicación detallada]\n\n¿Quieres algunos ejercicios de práctica?`;
        }

        function generateExercise() {
            return `Ejercicio de práctica (Nivel ${selectedLevel}):\n\n[Ejercicio]\n\nEscribe tu respuesta y te ayudaré a corregirla.`;
        }

        function generateDialogue() {
            return `Diálogo de práctica (Nivel ${selectedLevel}):\n\n[Diálogo en italiano con traducción]\n\n¿Quieres practicar este diálogo?`;
        }

        function generateGenericResponse(message) {
            return `Entiendo que quieres practicar italiano. ¿Te gustaría:\n
1. Traducir algunas frases
2. Practicar con ejercicios
3. Aprender gramática
4. Tener una conversación en italiano
5. Practicar pronunciación\n
Solo dime qué prefieres y adaptaré el contenido a tu nivel ${selectedLevel}.`;
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();

            if (message) {
                addMessage('user', message);
                const response = processUserMessage(message);
                setTimeout(() => addMessage('assistant', response), 500);
                input.value = '';
                input.style.height = 'auto';
            }
        }

        document.getElementById('message-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Mensaje inicial
        window.onload = function() {
            addMessage('assistant', `¡Bienvenido al ChatGPT de Italiano! 🇮🇹\n\nEstoy aquí para ayudarte a aprender italiano de manera interactiva y personalizada. Tu nivel actual es ${selectedLevel}.\n\nPuedes:\n1. Pedirme traducciones\n2. Solicitar explicaciones gramaticales\n3. Practicar con ejercicios\n4. Crear diálogos\n5. Corregir tu italiano\n\n¿Cómo te gustaría empezar?`);
        };
    </script>
</body>
</html>
