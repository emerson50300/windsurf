<!DOCTYPE html>

    <style>
        :root {
            --background-white: #f9f9f9;
            --background-main: #f2f2f2;
            --text-main: #333;
            --text-secondary: #666;
            --accent-color: #4CAF50;
            --button-color: #4CAF50;
            --hover-color: #388E3C;
            --hover-color-light: #e0e0e0;
            --shadow-color: rgba(0,0,0,0.1);
        }

        .alphabet-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin: 1rem 0;
        }

        .letter-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--background-white);
            padding: 1rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-soft);
            width: 100%;
            margin-bottom: 0.5rem;
        }

        .listen-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background-color: var(--accent-color);
            color: white;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            transition: all 0.3s ease;
            width: 100%;
        }

        .listen-button:hover {
            background-color: var(--hover-color);
            transform: translateY(-2px);
        }

        .listen-button i {
            font-size: 1.1rem;
        }

        @media (min-width: 769px) {
            .letter-item {
                width: calc(20% - 1rem);
                margin-bottom: 1rem;
            }
            
            .listen-button {
                width: auto;
            }
        }
    </style>
</head>

        function speak(text) {
